name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What review task is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Remember that the tool never decides applicability or compliance.
  - type: textarea
    id: law
    attributes:
      label: Legal sources
      description: Official EU sources involved, if any (EUR-Lex links).

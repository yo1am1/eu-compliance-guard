name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. Never paste real audit evidence, personal data or credentials. Report security issues privately (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `eu-compliance-guard --version`, or the plugin version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or plugin action, and a minimal synthetic declarations file if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Claude Code version.

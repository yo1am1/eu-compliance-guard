name: Release tag

# Publishes the GitHub release (and its tag) for a reviewed commit. Idempotent: an existing
# release is left alone. Change TAG and TARGET for the next release.
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-tag.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: v1.2.0
  TARGET: ed43dd3e65310b1c2ff243da4c8dbfed8016a618

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already exists"; exit 0; fi
          gh release create "$TAG" --target "$TARGET" --title "$TAG" --generate-notes

# Version updates wait 14 days after a release (supply-chain cooldown). Dependabot's
# security updates are not delayed by the cooldown, which covers the hotfix exception.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

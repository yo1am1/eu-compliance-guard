[project]
name = "eu-compliance-guard"
version = "2.4.0"
description = "Read-only EU requirements-to-law revalidation CLI and Claude Code plugin"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{ name = "Yehor Trepalin" }]
keywords = ["eu-law", "gdpr", "eprivacy", "ai-act", "compliance", "legal-review", "claude-code", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic==2.14.1",
]

[project.optional-dependencies]
# The planned local API; the CLI and Claude Code plugin need only Pydantic.
api = [
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://github.com/yo1am1/eu-compliance-guard"
Documentation = "https://github.com/yo1am1/eu-compliance-guard/blob/main/docs/cli.md"
Repository = "https://github.com/yo1am1/eu-compliance-guard"
Issues = "https://github.com/yo1am1/eu-compliance-guard/issues"
Changelog = "https://github.com/yo1am1/eu-compliance-guard/blob/main/CHANGELOG.md"

[project.scripts]
eu-compliance-guard = "eu_compliance_guard.__main__:main"

[tool.uv]
# Supply-chain cooldown: resolve only releases at least 14 days old. A security fix for a
# published advisory may be adopted sooner, with the reason recorded in the commit.
exclude-newer = "14 days"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eu_compliance_guard"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/eu_compliance_guard",
    "/frontend/src",
    "/frontend/scripts",
    "/frontend/package.json",
    "/frontend/package-lock.json",
    "/frontend/tsconfig.json",
    "/frontend/.gitignore",
    "/fixtures",
    "/tests",
    "/.claude-plugin",
    "/skills",
    "/hooks",
    "/types",
    "/licenses",
    "/pyproject.toml",
    "/uv.lock",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/Makefile",
    "/CHANGELOG.md",
    "/NOTICE",
    "/docs/cli.md",
    "/docs/plugin.md",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[dependency-groups]
dev = ["fastapi==0.159.1", "httpx==0.28.1"]

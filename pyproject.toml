[project]
name = "eu-compliance-guard"
version = "0.1.0"
description = "Local EU audit evidence, executable checks, and agent integrations"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = [
    "fastapi==0.143.1",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eu_compliance_guard"]

[tool.hatch.build.targets.sdist]
include = [
    "/eu_compliance_guard",
    "/frontend/src",
    "/frontend/scripts",
    "/frontend/package.json",
    "/frontend/package-lock.json",
    "/frontend/tsconfig.json",
    "/frontend/.gitignore",
    "/fixtures",
    "/tests",
    "/.claude-plugin",
    "/skills",
    "/hooks",
    "/types",
    "/licenses",
    "/pyproject.toml",
    "/uv.lock",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/Makefile",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[dependency-groups]
dev = ["httpx==0.28.1"]
